[project]
name = "reranker-budget-router"
version = "0.1.0"
description = "Local candidate-depth routing with auditable quality and compute budgets"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
